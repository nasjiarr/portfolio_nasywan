<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F8" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090D" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<!-- Google Fonts Optimized Preconnect & Preload -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
		/>

		<!-- Anti-FOUC Theme Script -->
		<script>
			(function () {
				try {
					var storedTheme = localStorage.getItem('theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var isDark = storedTheme === 'dark' || (!storedTheme && prefersDark);
					if (isDark) {
						document.documentElement.classList.add('dark');
						document.documentElement.style.colorScheme = 'dark';
					} else {
						document.documentElement.classList.remove('dark');
						document.documentElement.style.colorScheme = 'light';
					}
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-paper text-ink dark:bg-dark-bg dark:text-dark-text min-h-screen transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
